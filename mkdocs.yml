copyright: Copyright &copy; 2026 Clement Nevers
site_description: Personal website of Clément Nevers — Postdoctoral Research Fellow, Urban Physics & CFD
site_author: Clément Nevers
site_name: Clément Nevers
site_url: https://cdnevers.github.io/
site_dir: public

edit_uri: edit/main/docs/

nav:
  - Home: index.md
  - Research:
      - Overview: research/index.md
      - Publications: research/publications.md
  - Guides:
      - Overview: guides/index.md
  - Contact: contact.md

theme:
  name: material
  custom_dir: overrides
  logo: assets/images/Logo_CN.png
  favicon: assets/images/Logo_CN.png
  font:
    text: DM Sans
    code: Fira Code
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/toggle-switch
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/toggle-switch-off-outline
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - search.suggest
    - search.highlight
    - navigation.top

plugins:
  - search
  - mermaid2
  - git-revision-date-localized:
      fallback_to_build_date: false
  - macros
  - mkdocs-jupyter:
      include_source: True
  - awesome-pages
  - redirects:
      redirect_maps:
        openfoam/tutorials.md: guides/index.md
        openfoam/advanced.md: guides/index.md

markdown_extensions:
  - admonition
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:mermaid2.fence_mermaid
  - pymdownx.tabbed
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.critic:
      mode: view
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - def_list
  - attr_list
  - md_in_html
  - meta

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/cdnevers
      name: GitHub
    - icon: fontawesome/solid/graduation-cap
      link: https://scholar.google.ca/citations?user=GVoTFvMAAAAJ&hl=fr&oi=ao
      name: Google Scholar
    - icon: fontawesome/brands/researchgate
      link: https://www.researchgate.net/profile/Clement-Nevers
      name: ResearchGate
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/YOUR-LINKEDIN-HANDLE
      name: LinkedIn

extra_javascript:
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

extra_css:
  - assets/stylesheets/extra.css
